<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Quiz de vocabulário em espanhol do projeto Vamos a Estudiar Español." />
  <title>Vamos a Estudiar Español | Quiz de Vocabulário</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <section class="card" id="start-screen">
      <p class="eyebrow">Vamos a Estudiar Español</p>
      <h1 id="app-title">Quiz de Vocabulário</h1>
      <p class="intro">
        Teste seus conhecimentos de espanhol em uma atividade rápida com feedback imediato.
      </p>
      <button class="primary-button" id="start-button" type="button">Começar quiz</button>
    </section>

    <section class="card hidden" id="quiz-screen" aria-live="polite">
      <div class="quiz-header">
        <span id="progress">Pergunta 1 de 8</span>
        <span id="score">Pontuação: 0</span>
      </div>

      <div class="progress-track" aria-hidden="true">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <p class="category" id="category">Vocabulário</p>
      <h2 id="question">Pergunta</h2>

      <div class="answers" id="answers" role="group" aria-label="Alternativas da pergunta"></div>

      <p class="feedback" id="feedback" aria-live="assertive"></p>
      <button class="primary-button hidden" id="next-button" type="button">Próxima pergunta</button>
    </section>

    <section class="card hidden" id="result-screen">
      <p class="eyebrow">Resultado</p>
      <h2>Quiz concluído</h2>
      <p class="result-score" id="final-score"></p>
      <p id="result-message"></p>
      <button class="primary-button" id="restart-button" type="button">Refazer quiz</button>
    </section>
  </main>

  <footer>
    <p>
      Projeto complementar ao
      <a href="http://vamosaestudiarespanol.com.br/" target="_blank" rel="noreferrer">Vamos a Estudiar Español</a>
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
